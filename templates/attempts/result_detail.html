{% extends "base.html" %}

{% block title %}Exam Submitted{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow border-0">
        <div class="card-body text-center py-5 px-4">

          <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="#198754" viewBox="0 0 16 16">
              <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
          </div>

          <h3 class="mb-3">Exam Submitted Successfully</h3>

          <p class="lead text-muted mb-2">
            Your examination has been submitted successfully.
          </p>
          <p class="text-muted mb-4">
            Your teacher will review and publish your result.<br>
            Thank you.
          </p>

          <a href="{% url 'attempts:available_exams' %}" class="btn btn-primary px-4">
            Back to Available Exams
          </a>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
