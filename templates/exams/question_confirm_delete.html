{% extends 'base.html' %}
{% block title %}Delete Question{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h4>Delete Question?</h4>
        <p class="text-muted">{{ question.text }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'exams:question_list' exam.id %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
